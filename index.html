<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JogTogether | Find Your Running Buddy</title>
    <meta name="description" content="Connect with local joggers and find your perfect running partner.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B00;
            --primary-light: #FF8E3C;
            --primary-dark: #E65A00;
            --secondary: #FFFFFF;
            --bg: #F8F9FA;
            --text-dark: #1A1A1A;
            --text-muted: #6C757D;
            --card-shadow: 0 10px 30px rgba(255, 107, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Layout */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--secondary);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(var(--primary) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            background-color: #ffffff;
        }

        .app-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        header {
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        /* Screens */
        .screen {
            flex: 1;
            padding: 0 20px 100px;
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: block;
        }

        /* Home Screen */
        .hero {
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title span {
            font-size: 14px;
            color: var(--primary);
            font-weight: 400;
            cursor: pointer;
        }

        /* Jogger Cards */
        .jogger-list {
            display: grid;
            gap: 20px;
        }

        .jogger-card {
            background: var(--secondary);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid rgba(255, 107, 0, 0.1);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .jogger-card:hover {
            transform: scale(1.02);
            border-color: var(--primary);
            box-shadow: var(--card-shadow);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.2);
        }

        .jogger-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .jogger-info .college {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .distance-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 107, 0, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Floating Button */
        .find-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 18px 40px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            box-shadow: 0 15px 30px rgba(255, 107, 0, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 1000;
            transition: var(--transition);
            width: 80%;
            max-width: 320px;
        }

        .find-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        .find-button.loading {
            width: 60px;
            height: 60px;
            padding: 0;
            border-radius: 50%;
            font-size: 0;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        .loading .loader {
            display: block;
        }

        .loading svg, .loading span {
            display: none;
        }

        /* Match Screen */
        .match-screen {
            padding: 20px 0;
            text-align: center;
        }

        .match-card {
            background: white;
            border-radius: 35px;
            padding: 40px 24px;
            box-shadow: var(--card-shadow);
            margin-top: 10px;
            position: relative;
            border: 1px solid rgba(255, 107, 0, 0.1);
        }

        .match-avatar-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 35px;
        }

        .match-avatar {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
        }

        .match-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid white;
        }

        .match-card h2 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .match-card .college {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 35px;
        }

        .stat-box {
            background: #FFF9F5;
            padding: 20px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 107, 0, 0.05);
        }

        .stat-value {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 107, 0, 0.2);
        }

        .btn-outline {
            background: #F8F9FA;
            color: var(--text-muted);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            z-index: 10;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-content">
            <!-- Header -->
            <header>
                <div class="logo">
                    JogTogether<span class="logo-dot"></span>
                </div>
                <div style="background: #FFF0E6; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 107, 0, 0.1);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </header>

            <!-- Home Screen -->
            <main id="home-screen" class="screen active">
                <div class="hero">
                    <h1>Find your pace.</h1>
                    <p>There are <strong>12 joggers</strong> near you today.</p>
                </div>

                <div class="section-title">
                    Nearby Joggers
                    <span>See All</span>
                </div>

                <div id="jogger-list" class="jogger-list">
                    <!-- Cards will be injected here -->
                </div>
            </main>

            <!-- Match Screen -->
            <main id="match-screen" class="screen">
                <button class="back-btn" onclick="showScreen('home-screen')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                
                <div class="match-screen" id="match-content">
                    <!-- Match content will be injected here -->
                </div>
            </main>

            <button class="find-button" id="find-btn">
                <div class="loader"></div>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span>Find Partner</span>
            </button>
        </div>
    </div>

    <script>
        const joggers = [
            { id: 1, name: "Alex Chen", college: "Stanford University", distance: "0.8 km", pace: "5:30", runs: 124, color: "FF6B00" },
            { id: 2, name: "Sarah Miller", college: "UC Berkeley", distance: "1.2 km", pace: "6:15", runs: 89, color: "FF8E3C" },
            { id: 3, name: "Jordan Smith", college: "San Jose State", distance: "2.5 km", pace: "4:45", runs: 210, color: "E65A00" },
            { id: 4, name: "Priya Rao", college: "Santa Clara Univ", distance: "3.1 km", pace: "5:50", runs: 56, color: "FFB347" },
            { id: 5, name: "Marcus Wright", college: "Stanford University", distance: "3.8 km", pace: "5:10", runs: 167, color: "FF4500" },
            { id: 6, name: "Elena Rossi", college: "UC Berkeley", distance: "4.2 km", pace: "6:30", runs: 42, color: "FF7F50" }
        ];

        function init() {
            renderJoggers();
            
            const findBtn = document.getElementById('find-btn');
            findBtn.addEventListener('click', () => {
                if (findBtn.classList.contains('loading')) return;
                
                findBtn.classList.add('loading');
                
                // Simulate searching
                setTimeout(() => {
                    findBtn.classList.remove('loading');
                    const randomJogger = joggers[Math.floor(Math.random() * joggers.length)];
                    showMatch(randomJogger);
                }, 1500);
            });
        }

        function renderJoggers() {
            const list = document.getElementById('jogger-list');
            list.innerHTML = joggers.map(jogger => `
                <div class="jogger-card" onclick="showMatch(${JSON.stringify(jogger).replace(/"/g, '&quot;')})">
                    <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(jogger.name)}&background=${jogger.color}&color=fff&size=128&bold=true" alt="${jogger.name}" class="avatar">
                    <div class="jogger-info">
                        <h3>${jogger.name}</h3>
                        <div class="college">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                            ${jogger.college}
                        </div>
                        <div class="distance-badge">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            ${jogger.distance} away
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showMatch(jogger) {
            const matchContent = document.getElementById('match-content');
            matchContent.innerHTML = `
                <div class="match-card">
                    <div class="match-avatar-container">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(jogger.name)}&background=${jogger.color}&color=fff&size=256&bold=true" alt="${jogger.name}" class="match-avatar">
                        <div class="match-badge">98% Match</div>
                    </div>
                    
                    <h2>It's a Match!</h2>
                    <p class="college">${jogger.college}</p>
                    
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-value">${jogger.pace}/km</span>
                            <span class="stat-label">Avg Pace</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-value">${jogger.runs}</span>
                            <span class="stat-label">Total Runs</span>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-outline" onclick="showScreen('home-screen')">Maybe Later</button>
                        <button class="btn btn-primary" onclick="handleJogRequest('${jogger.name}')">Let's Jog</button>
                    </div>
                </div>
                
                <div style="margin-top: 30px; color: var(--text-muted); font-size: 14px; padding: 0 20px;">
                    <p><strong>Pro Tip:</strong> ${jogger.name} usually jogs at 6:00 AM. Perfect for catching the sunrise!</p>
                </div>
            `;
            
            showScreen('match-screen');
        }

        function handleJogRequest(name) {
            const btn = event.target;
            btn.innerHTML = 'Request Sent!';
            btn.style.background = '#4CAF50';
            btn.disabled = true;
            setTimeout(() => {
                showScreen('home-screen');
            }, 1500);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            const findBtn = document.getElementById('find-btn');
            if (screenId === 'home-screen') {
                findBtn.style.display = 'flex';
                findBtn.style.opacity = '1';
                findBtn.style.pointerEvents = 'auto';
            } else {
                findBtn.style.opacity = '0';
                findBtn.style.pointerEvents = 'none';
                setTimeout(() => {
                    if (document.getElementById('match-screen').classList.contains('active')) {
                        findBtn.style.display = 'none';
                    }
                }, 300);
            }
            window.scrollTo(0,0);
        }

        window.onload = init;
    </script>
</body>
</html>
