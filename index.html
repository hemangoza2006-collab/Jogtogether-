<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JogTogether | Find Your Running Buddy</title>
    <meta name="description" content="Connect with local joggers and find your perfect running partner.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B00;
            --primary-light: #FF8E3C;
            --primary-dark: #E65A00;
            --secondary: #FFFFFF;
            --bg: #F8F9FA;
            --text-dark: #1A1A1A;
            --text-muted: #6C757D;
            --card-shadow: 0 10px 30px rgba(255, 107, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Layout */
        .app-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(var(--primary) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            background-color: #ffffff;
        }

        .app-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 40px;
        }

        /* Navigation */
        header {
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 15px;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary);
        }

        /* Screens */
        .screen {
            flex: 1;
            padding: 40px 0 100px;
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: block;
        }

        /* Home Screen */
        .hero {
            margin-bottom: 50px;
            padding: 60px 0;
            text-align: center;
            background: linear-gradient(135deg, #FFF9F5 0%, #FFFFFF 100%);
            border-radius: 40px;
            margin-top: 20px;
            border: 1px solid rgba(255, 107, 0, 0.05);
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
        }

        .filter-tab {
            padding: 8px 20px;
            border-radius: 100px;
            background: #F8F9FA;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .filter-tab.active {
            background: rgba(255, 107, 0, 0.1);
            color: var(--primary);
            border-color: rgba(255, 107, 0, 0.2);
        }

        /* Jogger Cards Grid */
        .jogger-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .jogger-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .jogger-list {
                grid-template-columns: 1fr;
            }
            header { padding: 20px; }
            .app-content { padding: 0 20px; }
        }

        .jogger-card {
            background: var(--secondary);
            border-radius: 30px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            border: 1px solid rgba(255, 107, 0, 0.1);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .jogger-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 20px 50px rgba(255, 107, 0, 0.12);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 30px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(255, 107, 0, 0.2);
        }

        .jogger-info h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .jogger-info .college {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .distance-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 107, 0, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
        }

        /* Desktop Find Button */
        .find-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            box-shadow: 0 8px 20px rgba(255, 107, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
        }

        .find-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 107, 0, 0.4);
        }

        .find-button.loading {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            font-size: 0;
        }

        /* Match Screen - Modal Style */
        .match-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .match-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .match-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .match-overlay.active .match-container {
            transform: scale(1);
        }

        .match-card {
            background: white;
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 0 30px 100px rgba(0,0,0,0.2);
            position: relative;
            text-align: center;
            border: 1px solid rgba(255, 107, 0, 0.1);
        }

        .match-avatar-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 35px;
        }

        .match-avatar {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
        }

        .match-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid white;
        }

        .match-card h2 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .match-card .college {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 35px;
        }

        .stat-box {
            background: #FFF9F5;
            padding: 20px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 107, 0, 0.05);
        }

        .stat-value {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 20px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 107, 0, 0.2);
        }

        .btn-outline {
            background: #F8F9FA;
            color: var(--text-muted);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            z-index: 10;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-inner">
                <a href="#" class="logo">
                    JogTogether<span class="logo-dot"></span>
                </a>
                <div class="nav-links">
                    <a href="#" class="nav-link">Explore</a>
                    <a href="#" class="nav-link">History</a>
                    <a href="#" class="nav-link">Community</a>
                    <button class="find-button" id="find-btn">
                        <div class="loader"></div>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span>Find Partner</span>
                    </button>
                    <div style="background: #FFF0E6; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 107, 0, 0.1); cursor: pointer;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>
            </div>
        </header>

        <div class="app-content">
            <!-- Home Screen -->
            <main id="home-screen" class="screen active">
                <div class="hero">
                    <h1>Find your pace.</h1>
                    <p>Connect with local runners, share your route, and reach your fitness goals together.</p>
                </div>

                <div class="section-header">
                    <h2 class="section-title">Nearby Joggers</h2>
                    <div class="filter-tabs">
                        <div class="filter-tab active">All</div>
                        <div class="filter-tab">Morning</div>
                        <div class="filter-tab">Evening</div>
                        <div class="filter-tab">Elite</div>
                    </div>
                </div>

                <div id="jogger-list" class="jogger-list">
                    <!-- Cards will be injected here -->
                </div>
            </main>
        </div>

        <!-- Match Overlay (Modal) -->
        <div id="match-overlay" class="match-overlay" onclick="closeMatch(event)">
            <div class="match-container" onclick="event.stopPropagation()">
                <div id="match-content">
                    <!-- Match content will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const joggers = [
            { id: 1, name: "Alex Chen", college: "Stanford University", distance: "0.8 km", pace: "5:30", runs: 124, color: "FF6B00" },
            { id: 2, name: "Sarah Miller", college: "UC Berkeley", distance: "1.2 km", pace: "6:15", runs: 89, color: "FF8E3C" },
            { id: 3, name: "Jordan Smith", college: "San Jose State", distance: "2.5 km", pace: "4:45", runs: 210, color: "E65A00" },
            { id: 4, name: "Priya Rao", college: "Santa Clara Univ", distance: "3.1 km", pace: "5:50", runs: 56, color: "FFB347" },
            { id: 5, name: "Marcus Wright", college: "Stanford University", distance: "3.8 km", pace: "5:10", runs: 167, color: "FF4500" },
            { id: 6, name: "Elena Rossi", college: "UC Berkeley", distance: "4.2 km", pace: "6:30", runs: 42, color: "FF7F50" },
            { id: 7, name: "David Kim", college: "San Francisco St", distance: "5.0 km", pace: "4:55", runs: 132, color: "FF6347" },
            { id: 8, name: "Lisa Wong", college: "San Jose State", distance: "5.4 km", pace: "6:00", runs: 76, color: "FFA07A" },
            { id: 9, name: "James Bond", college: "Secret Academy", distance: "0.07 km", pace: "3:30", runs: 1000, color: "000000" }
        ];

        function init() {
            renderJoggers();
            
            const findBtn = document.getElementById('find-btn');
            findBtn.addEventListener('click', () => {
                if (findBtn.classList.contains('loading')) return;
                
                findBtn.classList.add('loading');
                
                // Simulate searching
                setTimeout(() => {
                    findBtn.classList.remove('loading');
                    const randomJogger = joggers[Math.floor(Math.random() * joggers.length)];
                    showMatch(randomJogger);
                }, 1500);
            });
        }

        function renderJoggers() {
            const list = document.getElementById('jogger-list');
            list.innerHTML = joggers.map(jogger => `
                <div class="jogger-card" onclick="showMatch(${JSON.stringify(jogger).replace(/"/g, '&quot;')})">
                    <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(jogger.name)}&background=${jogger.color}&color=fff&size=128&bold=true" alt="${jogger.name}" class="avatar">
                    <div class="jogger-info">
                        <h3>${jogger.name}</h3>
                        <div class="college">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                            ${jogger.college}
                        </div>
                        <div class="distance-badge">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            ${jogger.distance} away
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showMatch(jogger) {
            const matchContent = document.getElementById('match-content');
            matchContent.innerHTML = `
                <div class="match-card">
                    <button class="back-btn" onclick="closeMatch()" style="top: 30px; right: 30px; left: auto;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                    
                    <div class="match-avatar-container">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(jogger.name)}&background=${jogger.color}&color=fff&size=256&bold=true" alt="${jogger.name}" class="match-avatar">
                        <div class="match-badge">98% Match</div>
                    </div>
                    
                    <h2>It's a Match!</h2>
                    <p class="college">${jogger.college}</p>
                    
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-value">${jogger.pace}/km</span>
                            <span class="stat-label">Avg Pace</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-value">${jogger.runs}</span>
                            <span class="stat-label">Total Runs</span>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-outline" onclick="closeMatch()">Maybe Later</button>
                        <button class="btn btn-primary" onclick="handleJogRequest('${jogger.name}')">Let's Jog</button>
                    </div>
                    
                    <div style="margin-top: 30px; color: var(--text-muted); font-size: 14px;">
                        <p><strong>Pro Tip:</strong> ${jogger.name} usually jogs at 6:00 AM. Perfect for catching the sunrise!</p>
                    </div>
                </div>
            `;
            
            document.getElementById('match-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMatch() {
            document.getElementById('match-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleJogRequest(name) {
            const btn = event.target;
            btn.innerHTML = 'Request Sent!';
            btn.style.background = '#4CAF50';
            btn.disabled = true;
            setTimeout(() => {
                closeMatch();
            }, 1200);
        }

        window.onload = init;
    </script>
</body>
</html>
</body>
</html>
